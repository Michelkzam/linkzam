<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sincronizar - Linkzam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <link rel="stylesheet" href="assets/styles.css">
    <style>
        :root{--sidebar-width:225px}
        body{display:flex;margin:0;height:100vh;font-family:Segoe UI,Arial;background:#f4f7f6}
        aside{width:var(--sidebar-width);background:#2c3e50;color:#fff;padding:18px}
        .main{flex:1;padding:20px}
        .card{background:#fff;padding:16px;border-radius:8px}
        label{display:flex;align-items:center;gap:8px;margin:8px 0}
    </style>
</head>
<body>
    <script src="assets/layout.js"></script>
    <div id="sidebar-root"></div>
    <script>
        fetch('layout.html').then(r=>r.text()).then(html=>{ document.getElementById('sidebar-root').innerHTML = html; }).then(()=>{ if(window.initializeLayout) initializeLayout(); });
    </script>

    <div class="main-container">
        <header id="main-header">
            <div class="breadcrumb">Linkzam &gt; Sincronizar</div>
            <div id="date-display"></div>
            <div>Operador: <strong>Admin</strong></div>
        </header>

        <main class="content-view">
            <div class="card" style="margin-top:12px">
                <p>Escolha quais canais habilitar para sincronização (é necessário configurar credenciais no backend).</p>
                <label><input type="checkbox" id="sync-whatsapp"> WhatsApp</label>
                <label><input type="checkbox" id="sync-telegram"> Telegram</label>
                <label><input type="checkbox" id="sync-interna"> Mensageria Interna (Realtime)</label>
                <div style="margin-top:12px"><button onclick="salvar()">Salvar Configuração</button></div>
            </div>
        </main>
    </div>
    <script>function salvar(){alert('Salvar integrações (backend necessário)')}</script>
</body>
</html>
