<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Inválido - Linkzam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <script src="assets/layout.js"></script>
    <div id="sidebar-root"></div>
    <script>
        fetch('layout.html')
            .then(r => r.text())
            .then(html => { document.getElementById('sidebar-root').innerHTML = html; })
            .then(() => { if (window.initializeLayout) initializeLayout(); });
    </script>

    <div class="main-container">
        <header id="main-header">
            <div class="breadcrumb">Linkzam > Dashboard Inválido</div>
            <div id="date-display"></div>
            <div>Operador: <strong>Admin</strong></div>
        </header>

        <main class="content-view">
            <div class="card">
                <h2>Dashboard Inválido</h2>
                <p>Esta página agora utiliza o layout compartilhado para manter margens e espaçamentos consistentes.</p>
            </div>
            <div class="card">
                <div class="card-header">
                    <h2>Informações Rápidas</h2>
                </div>
                <p>Esta tela foi ajustada para se alinhar ao mesmo padrão das demais páginas da aplicação.</p>
            </div>
        </main>
    </div>
</body>
</html>
