<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clientes & SLA - Linkzam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        :root{--sidebar-width:225px}
        *{box-sizing:border-box;font-family:Segoe UI,Arial}
        body{display:flex;margin:0;height:100vh;background:#f4f7f6}
        aside{width:var(--sidebar-width);background:#2c3e50;color:#fff;padding:18px}
        .main{flex:1;padding:20px}
        header{height:60px;display:flex;align-items:center;justify-content:space-between;background:#fff;padding:0 16px;border-radius:6px}
        .card{background:#fff;padding:16px;border-radius:8px;margin-top:16px}
        label{display:block;margin:8px 0 4px}
        input,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    </style>
</head>
<body>
    <script src="assets/layout.js"></script>
    <div id="sidebar-root"></div>
    <script>
        fetch('layout.html').then(r=>r.text()).then(html=>{ document.getElementById('sidebar-root').innerHTML = html; }).then(()=>{ if(window.initializeLayout) initializeLayout(); });
    </script>

    <div class="main-container">
        <header id="main-header">
            <div class="breadcrumb">Linkzam &gt; Clientes / SLA</div>
            <div id="date-display"></div>
            <div>Operador: <strong>Admin</strong></div>
        </header>

        <main class="content-view">
            <div class="card">
                <h3>Novo Cliente</h3>
                <div class="row">
                    <div>
                        <label>Nome</label>
                        <input id="cliente-nome">
                    </div>
                    <div>
                        <label>CNPJ</label>
                        <input id="cliente-cnpj">
                    </div>
                </div>
                <label>Plano de SLA</label>
                <select id="cliente-sla">
                    <option>Bronze</option>
                    <option>Prata</option>
                    <option>Ouro</option>
                    <option>Platinum</option>
                </select>
                <div style="margin-top:12px"><button onclick="salvar()">Salvar</button></div>
            </div>
        </main>
    </div>
    <script>
        function salvar(){ alert('Salvar cliente (implementação backend necessária)'); }
    </script>
</body>
</html>
