<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clientes - Linkzam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <script src="assets/layout.js"></script>
    <div id="sidebar-root"></div>
    <script>
        fetch('layout.html')
            .then(r => r.text())
            .then(html => { document.getElementById('sidebar-root').innerHTML = html; })
            .then(() => { if (window.initializeLayout) initializeLayout(); });
    </script>

    <div class="main-container">
        <header id="main-header">
            <div class="breadcrumb">Linkzam > Clientes</div>
            <div id="date-display"></div>
            <div>Operador: <strong>Admin</strong></div>
        </header>

        <main class="content-view">
            <div class="card">
                <h2>Clientes</h2>
                <form id="formCliente">
                    <label>Nome</label>
                    <input id="nome" required>
                    <label>CNPJ</label>
                    <input id="cnpj">
                    <label>Plano SLA</label>
                    <select id="sla">
                        <option value="Bronze">Bronze</option>
                        <option value="Prata">Prata</option>
                        <option value="Ouro">Ouro</option>
                    </select>
                    <button type="submit" class="btn-primary">Criar Cliente</button>
                </form>

                <h3 style="margin-top:18px">Lista de Clientes</h3>
                <div id="lista"></div>
            </div>
        </main>
    </div>

    <script>
        function load() {
            fetch('/api/clients')
                .then(r => r.json())
                .then(d => {
                    const out = document.getElementById('lista');
                    out.innerHTML = '';
                    d.forEach(c => {
                        const el = document.createElement('div');
                        el.className = 'card';
                        el.style.padding = '14px';
                        el.style.marginBottom = '10px';
                        el.style.boxShadow = '0 1px 6px rgba(0,0,0,0.05)';
                        el.innerHTML = `<strong>${c.name}</strong><div style='font-size:0.9rem;color:#666;margin-top:4px'>CNPJ: ${c.cnpj || '-'} • SLA: ${c.slaPlan || '-'}</div>`;
                        out.appendChild(el);
                    });
                });
        }

        document.getElementById('formCliente').addEventListener('submit', function(e) {
            e.preventDefault();
            fetch('/api/clients', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('nome').value,
                    cnpj: document.getElementById('cnpj').value,
                    slaPlan: document.getElementById('sla').value
                })
            }).then(() => {
                this.reset();
                load();
            });
        });

        load();
    </script>
</body>
</html>
